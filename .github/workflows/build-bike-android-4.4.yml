name: Build Bike Adventure Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'bike-legacy-android-4.4/**'
      - '.github/workflows/build-bike-android-4.4.yml'

permissions:
  contents: write

concurrency:
  group: bike-adventure-android-4.4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Run unit tests
        run: gradle -p bike-legacy-android-4.4 testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: gradle -p bike-legacy-android-4.4 lintRelease --stacktrace --no-daemon

      - name: Build signed release APK
        run: gradle -p bike-legacy-android-4.4 clean assembleRelease --stacktrace --no-daemon

      - name: Verify Android 4.4 compatibility and stage APK
        run: |
          set -euo pipefail
          APK="$(find bike-legacy-android-4.4/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "sdkVersion:'19'" /tmp/badging.txt
          mkdir -p apk
          cp "$APK" apk/bike-adventure-android-4.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bike-adventure-android-4.4-release
          path: apk/bike-adventure-android-4.4.apk
          if-no-files-found: error

      - name: Commit APK only when changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/bike-adventure-android-4.4.apk
          git diff --cached --quiet || (git commit -m 'Build Bike Adventure Android 4.4 release APK' && git push origin HEAD:android-4.4)
