plugins { id 'com.android.application' }

android {
    namespace 'com.explapp.newdashcamlegacy'
    compileSdk 33

    defaultConfig {
        applicationId 'com.explapp.newdashcamlegacy'
        minSdk 19
        targetSdk 28
        versionCode 2
        versionName '2.0.0-native-dashcam'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
